<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nishan Sarker — Developer</title>
<meta name="description" content="Contact Nishan Sarker — Developer.">
<meta name="theme-color" content="#FBFBF8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Hind+Siliguri:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg:#FBFBF8;
  --ink:#0B0B0C;
  --accent:#E11D48;
  --radius:14px;
  --max-width:1280px;
  --nav-h:72px;
  --ease:cubic-bezier(.22,.61,.21,1);
  --font:'Plus Jakarta Sans','Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  width:100vw;height:100dvh;position:fixed;inset:0;overflow:hidden;
  font-family:var(--font);line-height:1.6;color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;
}
::selection{background:rgba(225,29,72,.18)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}

/* fixed background layers */
#globe{position:fixed;inset:0;width:100vw;height:100dvh;z-index:0;display:block;pointer-events:none}
#blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#blobs i{position:absolute;display:block;background:#8F8C84;opacity:.35}
#blobs .b1{top:10%;right:10%;width:130px;height:104px;border-radius:58% 42% 55% 45%/48% 55% 45% 52%;animation:blobwiggle 9s ease-in-out infinite}
#blobs .b2{top:60%;left:4%;width:74px;height:64px;border-radius:42% 58% 46% 54%/55% 44% 56% 45%;animation:blobwiggle 11s ease-in-out -3s infinite}
#blobs .b3{bottom:8%;right:24%;width:100px;height:82px;border-radius:52% 48% 60% 40%/44% 58% 42% 56%;animation:blobwiggle 13s ease-in-out -6s infinite}
@keyframes blobwiggle{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(9px,-11px) rotate(5deg)}50%{transform:translate(-7px,7px) rotate(-4deg)}75%{transform:translate(7px,9px) rotate(3deg)}}
#topfire{position:fixed;top:0;left:0;width:100vw;height:100dvh;z-index:1;pointer-events:none}
#gridfade{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;  background-size:34px 34px;
  -webkit-mask-image:radial-gradient(70% 70% at 50% 45%,#000 30%,transparent 100%);
  mask-image:radial-gradient(70% 70% at 50% 45%,#000 30%,transparent 100%);
  background-image:linear-gradient(rgba(11,11,12,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(11,11,12,.07) 1px,transparent 1px);
}

/* core — single viewport, no scroll */
#core{position:relative;z-index:2;flex:1;width:100%;display:flex;align-items:center;justify-content:center;
  padding:20px 16px;min-height:0}
.stage{display:flex;gap:26px;align-items:stretch;justify-content:center;max-height:100%;max-width:900px;width:100%}
/* solo mode — portrait is the sun, contacts orbit it */
.stage-solo{flex-direction:column;align-items:center;gap:20px;max-width:780px}
.stage-solo .pwrap{flex:none;width:min(400px,72vw);min-width:0;max-width:410px}
.who{text-align:center;position:relative;z-index:5;
  background:rgba(251,251,248,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(11,11,12,.12);border-radius:20px;padding:14px 34px 16px;
  box-shadow:0 18px 50px rgba(11,11,12,.10)}
.who h1{margin-top:0}
.orbit{position:absolute;inset:-52px -134px;z-index:4;pointer-events:none}
.orbit .contact{position:absolute;width:198px;pointer-events:auto;
  background:rgba(255,255,255,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 16px 40px rgba(11,11,12,.12);
  animation:bob 4.2s ease-in-out infinite}
.orbit .contact:nth-child(1){top:0;left:-18px;rotate:-4deg;animation-duration:3.8s}
.orbit .contact:nth-child(2){top:50%;left:-18px;transform:translateY(-50%);rotate:2.5deg;animation-delay:.8s;animation-duration:4.5s}
.orbit .contact:nth-child(3){top:0;right:-18px;rotate:3deg;animation-delay:1.6s;animation-duration:4s}
.orbit .contact:nth-child(4){bottom:0;right:-18px;rotate:-3deg;animation-delay:2.3s;animation-duration:4.7s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-9px) rotate(-1.1deg)}}
.orbit .contact:hover{margin-top:-3px}

/* hover skill card — dark pill, hard flat crimson dot (no glow) */
#skillTip{position:fixed;left:0;top:0;z-index:30;pointer-events:none;opacity:0;
  transform:translate(-50%,-160%) scale(var(--tipscale,1));transition:opacity .25s var(--ease);
  background:var(--ink);color:#fff;font-size:.68rem;font-weight:700;letter-spacing:.14em;
  padding:8px 14px 8px 11px;border-radius:99px;display:flex;gap:8px;align-items:center;white-space:nowrap;
  box-shadow:0 12px 30px rgba(11,11,12,.25)}
#skillTip::before{content:"";width:7px;height:7px;flex:none;border-radius:50%;background:var(--accent)}
#skillTip.show{opacity:1}
/* portrait — its own spotlight panel + ASCII ember halo */
.pwrap{position:relative;isolation:isolate;flex:0 1 400px;min-width:320px;max-width:410px;animation:cardIn .8s var(--ease) both}
.pwrap::before{content:"";position:absolute;inset:-8% -14%;z-index:0;pointer-events:none;
  background:radial-gradient(50% 50% at 50% 45%,rgba(225,29,72,.14),transparent 70%);
  filter:blur(10px)}
.stage-solo .pwrap{flex:none;width:min(400px,72vw);min-width:0;max-width:410px}
#halo{position:absolute;inset:-72px;width:calc(100% + 144px);height:calc(100% + 144px);
  pointer-events:none;z-index:3;opacity:.9}
.portrait{position:relative;z-index:1;overflow:hidden;height:100%;
  border-radius:30px;border:1px solid rgba(11,11,12,.14);background:#0B0B0C;
  outline:1px solid rgba(255,255,255,.7);outline-offset:5px;
  box-shadow:0 50px 110px rgba(11,11,12,.22),0 4px 14px rgba(11,11,12,.10),0 0 70px rgba(225,29,72,.10)}
/* portrait photo — same box the placeholder held */
.portrait img{width:100%;height:100%;min-height:500px;object-fit:cover;display:block;aspect-ratio:4/5}
.portrait .ph{height:100%;min-height:420px;display:none;flex-direction:column;gap:6px;
  align-items:center;justify-content:center;color:#FBFBF8;
  background:radial-gradient(120% 90% at 50% 0%,#23232b 0%,#0B0B0C 60%)}
.portrait .ph b{font-size:3.4rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.portrait .ph small{font-size:.62rem;font-weight:700;letter-spacing:.34em;text-indent:.34em;opacity:.5}
.portrait figcaption{position:absolute;left:14px;right:14px;bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:rgba(251,251,248,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(11,11,12,.1);border-radius:16px;padding:10px 14px}
.portrait figcaption strong{display:block;font-size:.9rem;letter-spacing:-.01em;line-height:1.2}
.portrait figcaption small{display:block;font-size:.6rem;font-weight:700;letter-spacing:.24em;opacity:.5}
.portrait .live{flex:none;display:flex;align-items:center;gap:7px;font-size:.62rem;font-weight:800;letter-spacing:.2em;
  background:rgba(11,11,12,.68);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:99px;padding:8px 14px}
.portrait .live::before{content:"";width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e}
.card{width:min(440px,100%);flex:0 1 420px;max-height:100%;overflow:hidden;background:rgba(255,255,255,.92);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(11,11,12,.12);
  border-radius:24px;padding:clamp(26px,4vh,36px) clamp(22px,4vw,32px);text-align:center;
  box-shadow:0 30px 80px rgba(11,11,12,.10),0 2px 6px rgba(11,11,12,.05);
  animation:cardIn .8s var(--ease) both}
@keyframes cardIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.eyebrow{font-size:.62rem;font-weight:700;letter-spacing:.32em;text-indent:.32em;opacity:.45;margin-bottom:18px}

.photo{width:104px;height:104px;margin:0 auto;border-radius:50%;overflow:visible;position:relative;background:none;border:0}
.photo::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(11,11,12,.14)}
.photo::after{content:"";position:absolute;right:6px;bottom:6px;width:12px;height:12px;border-radius:50%;
  background:#16a34a;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.photo img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%;border:3px solid #fff;
  box-shadow:0 12px 32px rgba(11,11,12,.18);background:#EFEDE6}
.photo .fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-weight:800;font-size:1.8rem;
  letter-spacing:-.02em;border-radius:50%;background:#0B0B0C;color:#fff}
h1{font-size:clamp(1.45rem,4.4vw,1.8rem);letter-spacing:-.03em;line-height:1.1;margin-top:16px;font-weight:800}
.role{display:inline-flex;align-items:center;gap:7px;margin-top:9px;font-size:.64rem;font-weight:700;
  letter-spacing:.26em;text-indent:.06em;color:rgba(11,11,12,.62);
  border:1px solid rgba(11,11,12,.14);border-radius:99px;padding:6px 14px 6px 11px;background:rgba(11,11,12,.02)}
.role::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.lede{font-size:.88rem;opacity:.55;margin-top:12px;letter-spacing:-.005em}

.contacts{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.contact{position:relative;overflow:hidden;isolation:isolate;
  display:flex;align-items:center;gap:13px;border-radius:16px;padding:9px 10px 9px 9px;
  border:1px solid rgba(11,11,12,.10);background:#fff;
  transition:border-color .25s var(--ease),transform .25s var(--ease),box-shadow .25s var(--ease);
  text-align:left;min-height:60px}
/* top data-bar: fills left→right on hover */
.contact::after{content:"";position:absolute;top:0;left:0;height:2px;width:100%;z-index:2;
  background:linear-gradient(90deg,var(--accent),#fb7185,var(--ink));
  transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
/* scanline sweep: fires on every hover */
.contact::before{content:"";position:absolute;top:-30%;bottom:-30%;left:-30%;width:34%;z-index:1;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(225,29,72,.13) 45%,rgba(11,11,12,.10) 55%,transparent);
  transform:translateX(-120%) skewX(-12deg);opacity:0}
.contact:hover::after,.contact:focus-visible::after{transform:scaleX(1)}
.contact:hover::before,.contact:focus-visible::before{opacity:1;animation:scanSweep .65s var(--ease)}
@keyframes scanSweep{from{transform:translateX(-120%) skewX(-12deg)}to{transform:translateX(480%) skewX(-12deg)}}
.contact .ic{position:relative;width:42px;height:42px;flex:none;border-radius:13px;display:grid;place-items:center;
  background:#F4F3EE;color:var(--ink);transition:.25s var(--ease);z-index:2}
/* targeting ring around the icon */
.contact .ic::after{content:"";position:absolute;inset:-4px;border-radius:16px;opacity:0;
  border:1px dashed rgba(225,29,72,.7);transition:opacity .25s}
.contact .ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.contact .meta{flex:1;min-width:0;line-height:1.3;z-index:2}
.contact .meta small{display:flex;align-items:center;gap:6px;font-size:.6rem;font-weight:700;letter-spacing:.2em;opacity:.42}
.contact .meta small::after{content:"";width:22px;height:1px;background:currentColor;opacity:.5;transition:width .3s var(--ease)}
.contact .meta strong{display:block;font-size:.95rem;font-weight:700;letter-spacing:-.01em;transition:letter-spacing .3s var(--ease),transform .3s var(--ease)}
.contact .arr{position:relative;width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;z-index:2;
  font-size:.9rem;color:rgba(11,11,12,.35);transition:.25s var(--ease);overflow:hidden}
/* radar ping behind the arrow */
.contact .arr::before{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid var(--accent);
  transform:scale(.4);opacity:0}
.contact:hover,.contact:focus-visible{border-color:var(--ink);transform:translateY(-2px);box-shadow:0 14px 30px rgba(11,11,12,.12);outline:none}
.contact:hover .ic,.contact:focus-visible .ic{background:var(--accent);color:#fff;animation:iconBoot .45s var(--ease)}
.contact:hover .ic::after,.contact:focus-visible .ic::after{opacity:1;animation:ringSpin 3s linear infinite}
@keyframes iconBoot{0%{transform:scale(.85)}45%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes ringSpin{to{transform:rotate(360deg)}}
.contact:hover .meta small::after,.contact:focus-visible .meta small::after{width:44px;background:var(--accent);opacity:1}
.contact:hover .meta strong,.contact:focus-visible .meta strong{letter-spacing:.02em;transform:translateX(3px)}
.contact:hover .arr,.contact:focus-visible .arr{background:var(--accent);color:#fff}
.contact:hover .arr::before,.contact:focus-visible .arr::before{animation:ping 1s var(--ease) infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.contact:active{transform:translateY(0) scale(.985)}
/* staggered boot-in so the stack feels like a system coming online */
.contacts .contact:nth-child(1){animation:rowIn .5s var(--ease) .05s both}
.contacts .contact:nth-child(2){animation:rowIn .5s var(--ease) .12s both}
.contacts .contact:nth-child(3){animation:rowIn .5s var(--ease) .19s both}
.contacts .contact:nth-child(4){animation:rowIn .5s var(--ease) .26s both}
@keyframes rowIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.contact[data-c="email"]:hover .ic,.contact[data-c="email"]:focus-visible .ic{background:var(--accent)}

@keyframes pulse{50%{opacity:.4}}

.portrait .live-float{position:absolute;right:14px;bottom:14px}
@media(max-width:820px){
  .portrait .live-float{right:10px;bottom:10px}
  #core{padding:14px 12px}
  .stage{flex-direction:column;align-items:center;gap:12px;max-width:420px}
  .pwrap{flex:none;width:min(400px,94vw);min-width:0;max-width:400px;margin:0 auto}
  .stage-solo .pwrap{width:min(400px,94vw);max-width:400px}
  .stage-solo .portrait{width:min(250px,64vw);margin:0 auto}
  .stage-solo #halo{inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px)}
  .stage-solo{gap:12px}
  .stage-solo .who{margin:0 auto;padding:10px 22px 12px}
  .stage-solo .who h1{font-size:1.2rem}
  .stage-solo .role{font-size:.56rem;letter-spacing:.22em;padding:5px 12px 5px 10px}
  .orbit{position:relative;inset:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;
    width:min(400px,94vw);pointer-events:auto;margin:6px auto 0;justify-content:center;z-index:4}
  .orbit .contact{min-height:52px;padding:7px 8px 7px 7px;gap:9px}
  .orbit .contact .ic{width:34px;height:34px;border-radius:11px}
  .orbit .contact .ic svg{width:15px;height:15px}
  .orbit .contact .meta small{font-size:.54rem;letter-spacing:.16em}
  .orbit .contact .meta strong{font-size:.82rem}
  .orbit .contact .arr{width:26px;height:26px;font-size:.8rem}
  .stage-solo .portrait{z-index:1}
  .stage-solo #halo{z-index:3}
  .stage-solo .who{z-index:5}
  .orbit .contact{position:static;translate:none;rotate:none;width:auto}
  .portrait{border-radius:22px}
  .portrait img{min-height:0;aspect-ratio:1/1}
  .portrait .ph{min-height:0;height:min(30dvh,260px)}
}
@media(max-width:640px){
  #core{padding:12px}
  .contact{min-height:52px}
}
@media(max-height:700px){
  .portrait img{min-height:300px}
  .portrait .ph{min-height:300px}
  .stage-solo{gap:10px}
  .stage-solo .portrait{width:min(220px,58vw)}
  .stage-solo .who{padding:8px 20px 10px}
  .card{padding:20px}
}
/* short desktop screens only — never touch the mobile grid orbit */
@media(max-height:700px) and (min-width:821px){
  .orbit{inset:-34px -92px}
  .who h1{font-size:1.3rem}
  .contacts{margin-top:14px}
  .lede{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important;transition-duration:.001s !important}
  .card{animation:none}
}
</style>
</head>
<body>

<main id="core">

  </div>
  <div class="who">

</main>

<script>
"use strict";
/* ============ 1. CONFIG — edit only this block ============ */
const CONFIG = {
  developer: { name: "Nishan Sarker", role: "Developer", image: "https://i.postimg.cc/LsbLJ42F/Whats-App-Image-2026-09-20-at-8-51-04-PM.jpg" },
  contact: {
    instagram: "https://www.instagram.com/itx_nishan/",
    facebook:  "https://www.facebook.com/ItxNishan",
    whatsapp:  "https://wa.me/@ionize_",
    email:     "mailto:nishansarker850@gmail.com"
  }
};
(function applyConfig(){
  document.getElementById('devName').textContent = CONFIG.developer.name;
  const img = document.getElementById('devImg');
  if(img){
    img.src = CONFIG.developer.image;
    img.alt = CONFIG.developer.name;
    img.onerror = () => { img.style.display='none'; document.getElementById('photoFallback').style.display='flex'; };
  }
  document.querySelectorAll('.contact').forEach(a => { if(CONFIG.contact[a.dataset.c]) a.href = CONFIG.contact[a.dataset.c]; });
})();

/* ============ 2. SHARED FLAGS ============ */
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============ 3. ASCII EMBER HALO — ambient only, zero pointer input ============
   Characters rise like heat around the portrait and fade. Decorative. */
(function halo(){
  const cv = document.getElementById('halo');
  const cx = cv.getContext('2d');
  const GLYPHS = ['.',':',';','+','*','#','@'];
  let W2=0,H2=0,parts=[];
  const COUNT = matchMedia('(max-width: 820px)').matches ? 60 : 100;
  function size(){
    const dpr = Math.min(devicePixelRatio||1, 1.5);
    const r = cv.getBoundingClientRect();
    W2=r.width; H2=r.height;
    cv.width=Math.max(1,r.width*dpr); cv.height=Math.max(1,r.height*dpr);
    cx.setTransform(dpr,0,0,dpr,0,0);
  }
  function spawn(bottom){
    return { x: Math.random()*W2, y: (bottom && Math.random()<0.55)? H2+8 : Math.random()*H2,
      vy: -(Math.random()*22+10), sway: Math.random()*6.28, sw: Math.random()*14+6,
      life: Math.random()*.5+.5, age: 0, max: Math.random()*3.5+2.6,
      size: Math.random()*10+12, crimson: Math.random()<.34 };
  }
  function init(){ size(); parts = Array.from({length:COUNT},()=>spawn(false)); }
  init();
  let rsz2; addEventListener('resize',()=>{clearTimeout(rsz2);rsz2=setTimeout(init,200);});
  cx.textAlign='center'; cx.textBaseline='middle';
  let start=performance.now();
  function tick(now){
    requestAnimationFrame(tick);
    const t=(now-start)/1000;
    const motion = reducedMotion?0:1;
    cx.clearRect(0,0,W2,H2);
    cx.font='500 12px "Plus Jakarta Sans", monospace';
    for(let i=0;i<parts.length;i++){
      const p=parts[i];
      if(motion){ p.age+=1/60; p.y+=p.vy/60; p.sway+=1/60; p.x+=Math.sin(p.sway*2+t)*.3; }
      const k=p.age/p.max;
      if(k>=1||p.y<-12){ parts[i]=spawn(true); continue; }
      const fade = k<.12 ? k/.12 : (k>.72 ? Math.max(0, 1-(k-.72)/.28) : 1); // sustain mid-flight
      const gi = Math.min(GLYPHS.length-1, (k*GLYPHS.length)|0);
      cx.globalAlpha = Math.max(0, fade*(p.crimson?1:.88));
      cx.fillStyle = p.crimson ? '#C81E4A' : '#0B0B0C';
      cx.font = `500 ${p.size.toFixed(0)}px "Plus Jakarta Sans", monospace`;
      cx.fillText(GLYPHS[gi], p.x, p.y);
    }
    cx.globalAlpha=1;
  }
  if(reducedMotion){ // one calm static sprinkle
    cx.clearRect(0,0,W2,H2);
    cx.font='500 12px "Plus Jakarta Sans", monospace';
    parts.slice(0,24).forEach(p=>{ cx.globalAlpha=.35; cx.fillStyle='#0B0B0C'; cx.fillText('.',p.x,p.y); });
    cx.globalAlpha=1;
  } else requestAnimationFrame(tick);
})();

/* ============ 3. TOP-DOWN ASCII FIRE — ambient only, zero pointer input ============
   Column flame-fronts hang from the top edge: dense crimson blocks up high,
   dissolving into faint ink drizzle that dies out before mid-screen. */
(function topfire(){
  const cv = document.getElementById('topfire');
  const c2 = cv.getContext('2d');
  const BLOCKS = ['\u00B7','\u2591','\u2592','\u2593','\u2588']; // · ░ ▒ ▓ █
  let W3=0,H3=0,cell=16,cols=0,rows=0;
  function size(){
    const small = matchMedia('(max-width: 640px)').matches;
    const dpr = Math.min(devicePixelRatio||1, small?1:1.5);
    W3=innerWidth; H3=innerHeight;
    cv.width=Math.max(1,W3*dpr); cv.height=Math.max(1,H3*dpr);
    cv.style.width=W3+'px'; cv.style.height=H3+'px';
    c2.setTransform(dpr,0,0,dpr,0,0);
    cell = small?22:16;
    cols = Math.ceil(W3/cell);
    rows = Math.ceil(H3*0.48/cell);
  }
  size();
  let rsz3; addEventListener('resize',()=>{clearTimeout(rsz3);rsz3=setTimeout(size,200);});
  c2.textAlign='center'; c2.textBaseline='middle';
  // column flame-fronts: dense crimson blocks up top dissolving downward
  function front(x,t){
    return 0.66
      + 0.19*Math.sin(x*0.10 + t*0.9)
      + 0.11*Math.sin(x*0.027 - t*0.5 + 1.7)
      + 0.05*Math.sin(x*0.51 + t*2.3);
  }
  function draw(t){
    c2.clearRect(0,0,W3,H3);
    c2.font = `500 ${cell}px ui-monospace,Menlo,Consolas,monospace`;
    for(let gx=0; gx<cols; gx++){
      const f = front(gx,t);
      for(let gy=0; gy<rows; gy++){
        const yn = gy/rows; // 0 at top edge → 1 at fade-out
        const fall = Math.sin(gy*0.55 - t*3.4 + Math.sin(gx*0.7)*1.6)*0.07;
        const v = f - yn*1.08 + fall;
        if(v<0.26) continue;
        const gi = Math.min(BLOCKS.length-1, ((v-0.26)*6.5)|0);
        const depthFade = 1-yn*0.85;
        if(v>0.45){ // dense front — crimson band
          c2.fillStyle = '#E11D48';
          c2.globalAlpha = Math.min(0.9,(v-0.45)*2.4) * depthFade + 0.08;
        } else { // sparse drizzle — faint ink
          c2.fillStyle = '#0B0B0C';
          c2.globalAlpha = (v-0.26)*1.6 * depthFade;
        }
        c2.fillText(BLOCKS[gi], gx*cell+cell/2, gy*cell+cell/2);
      }
    }
    c2.globalAlpha=1;
  }
  if(reducedMotion){ draw(0); return; }
  let start=performance.now();
  (function tick(now){
    requestAnimationFrame(tick);
    draw((now-start)/1000);
  })(start);
})();

/* ============ 4. NETWORK GLOBE — ambient 3D piece (no mouse input) ============
   A wireframe icosahedron with crimson vertex nodes, a counter-rotating
   inner core, an orbit ring + satellite. Spins on its own. Random skill
   cards drift around it behind all foreground UI. */
(function globe(){
  const cv = document.getElementById('globe');
  if(!window.THREE){ cv.style.display='none'; return; }
  let renderer;
  try{
    renderer = new THREE.WebGLRenderer({canvas:cv, alpha:true, antialias:true});
  }catch(e){ cv.style.display='none'; return; }
  const small = matchMedia('(max-width: 640px)').matches;
  renderer.setPixelRatio(Math.min(devicePixelRatio||1, small?1:1.5));
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
  cam.position.set(0,0,9.5);
  cam.lookAt(0,0,0);
  const rig = new THREE.Group();
  scene.add(rig);
  const R = 2.6;
  const globeGeo = new THREE.IcosahedronGeometry(R,2);
  rig.add(new THREE.LineSegments(
    new THREE.WireframeGeometry(globeGeo),
    new THREE.LineBasicMaterial({color:0x0B0B0C, transparent:true, opacity:0.15})));
  const nodePts = new THREE.Points(
    globeGeo,
    new THREE.PointsMaterial({color:0xE11D48, size:0.06, transparent:true, opacity:0.9}));
  rig.add(nodePts);
  const core = new THREE.LineSegments(
    new THREE.WireframeGeometry(new THREE.IcosahedronGeometry(1.45,1)),
    new THREE.LineBasicMaterial({color:0xE11D48, transparent:true, opacity:0.4}));
  rig.add(core);
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(3.5, 0.008, 8, 140),
    new THREE.MeshBasicMaterial({color:0x0B0B0C, transparent:true, opacity:0.28}));
  ring.rotation.x = Math.PI/2.35;
  rig.add(ring);
  const sat = new THREE.Mesh(
    new THREE.SphereGeometry(0.075, 16, 16),
    new THREE.MeshBasicMaterial({color:0xE11D48}));
  rig.add(sat);
  function layout(){
    renderer.setSize(innerWidth, innerHeight);
    cam.aspect = innerWidth/innerHeight;
    cam.updateProjectionMatrix();
    rig.scale.setScalar(Math.min(innerWidth,innerHeight) < 640 ? 0.72 : 1);
  }
  layout();
  let rsz4; addEventListener('resize',()=>{clearTimeout(rsz4);rsz4=setTimeout(layout,200);});
  /* hover skill cards — front-facing vertices only.
     The card rides its vertex for 3s, scaling with camera depth. */
  const SKILLS = ["Programming","Web Development","Game Development","VFX","Video Editing",
    "AI","Machine Learning","Graphic Design","Creative Coding","Motion Design","WebGL & 3D","UI Engineering"];
  const tip = document.getElementById('skillTip');
  // magnifier marker: a bigger crimson point pinned on the triggered vertex
  const hlGeo = new THREE.BufferGeometry();
  hlGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(3),3));
  const hl = new THREE.Points(hlGeo,
    new THREE.PointsMaterial({color:0xE11D48, size:0.2, transparent:true, opacity:0.95}));
  hl.visible = false; hl.frustumCulled = false;
  rig.add(hl);
  const ray = new THREE.Raycaster();
  ray.params.Points = {threshold:0.2};
  const ndc = new THREE.Vector2();
  const projV = new THREE.Vector3();
  const tipLocal = new THREE.Vector3();
  let lastSkill=-1, tipOn=false, tipUntil=0, pickX=0, pickY=0, needPick=false;
  addEventListener('pointermove', e=>{
    if(e.target.closest && e.target.closest('a,button,figure,.orbit')){ needPick=false; tipHide(); return; }
    pickX=e.clientX; pickY=e.clientY; needPick=true;
  }, {passive:true});
  // sphere facing test: normal (≈world pos) must point toward the camera
  function isFacing(lx,ly,lz){
    projV.set(lx,ly,lz).applyMatrix4(rig.matrixWorld);
    const il = 1/(Math.hypot(projV.x,projV.y,projV.z)||1);
    const dx = cam.position.x-projV.x, dy = cam.position.y-projV.y, dz = cam.position.z-projV.z;
    const dl = 1/(Math.hypot(dx,dy,dz)||1);
    return (projV.x*il*dx*dl + projV.y*il*dy*dl + projV.z*il*dz*dl) > 0.3;
  }
  const CIPHER = "!<>-_/[]{}=+*^?#01";
  let cipherTimer = null;
  function cipherReveal(word){ // scramble resolves left → right
    if(cipherTimer){ clearInterval(cipherTimer); cipherTimer=null; }
    let frame = 0;
    cipherTimer = setInterval(()=>{
      frame++;
      const done = frame; // one character per tick — snappy
      let out = '';
      for(let i=0;i<word.length;i++){
        const ch = word[i];
        out += (ch===' ' || i<done) ? ch : CIPHER[(Math.random()*CIPHER.length)|0];
      }
      tip.textContent = out;
      if(done>=word.length){ clearInterval(cipherTimer); cipherTimer=null; tip.textContent=word; }
    }, 28);
  }
  function tipShow(lx,ly,lz){
    let s; do{ s=(Math.random()*SKILLS.length)|0; }while(s===lastSkill);
    lastSkill=s;
    tipLocal.set(lx,ly,lz);
    hlGeo.attributes.position.setXYZ(0,lx,ly,lz);
    hlGeo.attributes.position.needsUpdate = true;
    hl.visible = true;
    tipOn=true; tipUntil=performance.now()+3000;
    tip.classList.add('show');
    cipherReveal(SKILLS[s]);
  }
  function tipHide(){
    if(cipherTimer){ clearInterval(cipherTimer); cipherTimer=null; }
    tip.classList.remove('show'); tipOn=false; hl.visible=false;
  }
  function tipFollow(){
    if(!tipOn) return;
    if(performance.now()>tipUntil){ tipHide(); return; }
    projV.copy(tipLocal);
    rig.localToWorld(projV);
    const dist = cam.position.distanceTo(projV); // nearer vertex → bigger card
    tip.style.setProperty('--tipscale', Math.min(1.35, Math.max(0.62, 9.5/dist)).toFixed(3));
    projV.project(cam);
    tip.style.left=((projV.x*0.5+0.5)*innerWidth).toFixed(1)+'px';
    tip.style.top=((-projV.y*0.5+0.5)*innerHeight).toFixed(1)+'px';
  }
  function render(t){
    rig.rotation.y = t*0.1;
    rig.rotation.x = Math.sin(t*0.3)*0.05;
    core.rotation.y = -t*0.12;
    core.rotation.z = t*0.07;
    sat.position.set(Math.cos(t*0.45)*3.5, Math.sin(t*0.8)*0.7, Math.sin(t*0.45)*3.5);
    renderer.render(scene, cam);
    tipFollow(); // card rides its vertex every frame
  }
  if(reducedMotion){ render(0.6); return; }
  (function tick(){
    requestAnimationFrame(tick);
    const t = performance.now()/1000;
    if(needPick){
      needPick=false;
      ndc.set((pickX/innerWidth)*2-1, -(pickY/innerHeight)*2+1);
      ray.setFromCamera(ndc, cam);
      const hits = ray.intersectObject(nodePts);
      for(let i=0;i<hits.length;i++){
        const pa = globeGeo.attributes.position, idx = hits[i].index;
        const lx=pa.getX(idx), ly=pa.getY(idx), lz=pa.getZ(idx);
        // dwelling on the same vertex → leave the ride alone (no flicker)
        if(tipOn && Math.abs(lx-tipLocal.x)<1e-4 && Math.abs(ly-tipLocal.y)<1e-4 && Math.abs(lz-tipLocal.z)<1e-4) break;
        if(isFacing(lx,ly,lz)){ tipShow(lx,ly,lz); break; } // skip back-side nodes
      }
    }
    render(t);
  })();
})();
</script>
</body>
